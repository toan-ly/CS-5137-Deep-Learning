data_root: ./data
img_size: 512
val_ratio: 0.2
num_workers: 2
cache_rate: 1.0
epochs: 200
batch_size: 4
loss: tversky+focal+hausdorff@0.45,0.45,0.1
lr: 3e-4
scheduler: cosine
optimizer: adamw
use_green_channel: false
use_patch: true
patch_size: 128
dropout: 0.1
seed: 42
base_channels: 64
depth: 3
in_channels: 3
out_channels: 1
device: cuda
early_stopping: true
patience: 10
activation: leaky_relu
up_mode: bilinear
save_dir: checkpoints
save_plots_path: results/predictions